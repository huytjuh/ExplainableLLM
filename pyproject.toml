[project]
name = "explainable-llm"
version = "0.1.0"
description = "Implementation-level explanations and starter code for LLMs, RAG, evaluation, tracing, and cloud workflows."
authors = [{ name = "ExplainableLLM Contributors" }]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = ["PyYAML>=6.0.0", "pydantic>=2.0.0"]

[project.optional-dependencies]
gemini = ["google-genai>=1.0.0"]
openai = ["openai>=1.0.0"]
claude = ["anthropic>=0.30.0"]
all-llms = ["google-genai>=1.0.0", "openai>=1.0.0", "anthropic>=0.30.0"]

[tool.poetry]
package-mode = false
packages = [
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"

[tool.pytest.ini_options]
pythonpath = [
    "src/01_NLP",
    "src/02_transformer",
    "src/03_LLM",
    "src/04_RAG",
    "src/05_vector_search",
    "src/06_evaluation",
    "src/07_tracing",
    "src/08_LLMOps",
    "src/09_MCP"
]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
