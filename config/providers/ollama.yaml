# Local Ollama config.
# No API key needed. Optional host: set OLLAMA_HOST or edit base_url.
provider: ollama
model: llama3.2
base_url: http://localhost:11434

generation:
  temperature: 0.2
  top_p: 0.95
  top_k: 40
  max_output_tokens: 512
  stop_sequences: []
  response_mime_type: null
  system_instruction: You explain LLM concepts clearly for developers.

